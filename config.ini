# Edax book error tool 0.8 beta. Place this file next to the executable.
# log_level and adjusted_level: DEBUG, INFO, WARNING, ERROR, NONE
log_level=INFO
auto_adjust_level=False
adjusted_level=DEBUG

# Modes 1-7. Mode 5 reads specified_positions.txt instead of scanning the book.
mode=1

# -1 disables each error limit. Non-negative values are measured in discs.
per_move_error=-1
cumulative_error=-1

# -1 means no manual book-move depth limit. Pass counts as one move.
# When auto_detect_book_depth=True, this setting is ignored.
max_book_move_depth=-1
auto_detect_book_depth=False

# Console progress interval for search (book loading still reports every 100000 records).
progress_update_interval=100000
